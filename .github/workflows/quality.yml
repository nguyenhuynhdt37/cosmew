name: Quality
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    name: Quality (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Record checkout and runtime
        run: |
          git rev-parse HEAD
          bun --version
          uname -a
      - name: Typecheck, lint and all product tests
        run: bun run quality
