<div id="fyn-motion">
  <div class="viz-row">
    <label class="form-label" for="fyn-state">Trạng thái</label>
    <select class="form-select" id="fyn-state">
      <option value="idle">Đứng chờ</option><option value="thinking">Đang xử lý</option>
      <option value="streaming">Đang trả lời</option><option value="waiting">Chờ bạn duyệt</option>
      <option value="done">Hoàn tất</option><option value="error">Gặp lỗi</option>
      <option value="cancelled">Đã dừng</option><option value="sleep">Ngủ</option>
    </select>
    <button class="btn" id="fyn-cycle" type="button" aria-pressed="false">Chạy chu kỳ</button>
  </div>
  <canvas id="fyn-canvas" width="640" height="360" role="img" aria-label="Phác thảo cáo pixel Fyn với tai lớn và đuôi hình dấu nhắc terminal"></canvas>
  <div class="viz-row"><strong>FYN</strong><span id="fyn-description" aria-live="polite"></span></div>
</div>
<style>
#fyn-motion {display:grid;gap:calc(var(--font-size-base) * 1)}
#fyn-motion canvas {display:block;width:100%;max-width:640px;height:auto;margin:auto;image-rendering:pixelated}
#fyn-motion select {max-width:220px}
</style>
<script>
(() => {
  const root = document.getElementById('fyn-motion');
  const canvas = root.querySelector('canvas');
  const ctx = canvas.getContext('2d');
  const select = root.querySelector('select');
  const button = root.querySelector('button');
  const description = root.querySelector('#fyn-description');
  const motion = matchMedia('(prefers-reduced-motion: reduce)');
  const labels = {
    idle:'Thở nhẹ · chớp mắt · vẫy đuôi chậm', thinking:'Nghiêng đầu · đuôi cuộn theo nhịp',
    streaming:'Gõ chân · đuôi nhịp đều', waiting:'Giơ chân · nhìn bạn · giữ nguyên chờ duyệt',
    done:'Nhảy một lần · lóe sao · trở về đứng chờ', error:'Cụp tai · dấu ! · không ăn mừng',
    cancelled:'Hạ đuôi · dừng chuyển động', sleep:'Cuộn người · mắt khép · z Z'
  };
  const saved = window.openai?.widgetState?.modelContent;
  let state = saved && labels[saved.state] ? saved.state : 'idle';
  let cycling = false, start = performance.now(), cycleStart = 0, last = 0;
  const sequence = ['idle','thinking','streaming','done','idle','sleep'];
  const durations = [3000,4000,4000,1800,3000,4000];
  const total = durations.reduce((a,b)=>a+b,0);
  function change(next, persist=false) {
    state = next; start = performance.now(); select.value = state;
    description.textContent = labels[state];
    if (persist) window.openai?.setWidgetState({modelContent:{concept:'Fyn — cáo đốm lửa',state},privateContent:null}).catch(()=>{});
  }
  function stopCycle(){cycling=false;button.textContent='Chạy chu kỳ';button.setAttribute('aria-pressed','false')}
  select.addEventListener('change',()=>{stopCycle();change(select.value,true)});
  button.addEventListener('click',()=>{cycling=!cycling;cycleStart=performance.now();button.textContent=cycling?'Dừng chu kỳ':'Chạy chu kỳ';button.setAttribute('aria-pressed',String(cycling));if(cycling)change('idle')});
  window.addEventListener('openai:set_globals',event=>{const value=event.detail?.globals?.widgetState?.modelContent?.state;if(labels[value]){stopCycle();change(value)}});
  function render(now) {
    requestAnimationFrame(render);
    if(now-last<125 || document.hidden)return;last=now;
    if(cycling){let elapsed=(now-cycleStart)%total;let index=0;while(elapsed>=durations[index])elapsed-=durations[index++];if(state!==sequence[index])change(sequence[index])}
    const t=motion.matches?0:(now-start)/1000;
    const css=getComputedStyle(root);
    const color=(name,fallback)=>css.getPropertyValue(name).trim()||fallback;
    const ink=color('--foreground','CanvasText'),accent=color('--orange','CanvasText');
    const pale=color('--background','Canvas'),secondary=color('--muted-foreground','GrayText');
    ctx.clearRect(0,0,640,360);
    ctx.save();ctx.translate(190,65);ctx.scale(7,7);
    const rect=(x,y,w,h,c)=>{ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),w,h)};
    const bob=state==='done'? -Math.round(Math.sin(Math.min(t/0.8,1)*Math.PI)*4) : state==='cancelled'?0:Math.round(Math.sin(t*2)*0.6);
    const tail=state==='cancelled'||state==='error'?2:Math.round(Math.sin(t*(state==='thinking'?7:state==='streaming'?5:2))*1.3);
    rect(7,30,22,1,secondary);ctx.translate(0,bob);
    // Original block sprite: chevron tail, rounded body, large upright ears.
    rect(28,17+tail,4,3,accent);rect(31,19+tail,4,3,accent);rect(34,21+tail,3,3,pale);
    rect(31,23+tail,4,3,accent);rect(27,25+tail,5,3,accent);
    rect(12,18,15,10,accent);rect(10,21,18,5,accent);rect(14,22,9,6,pale);
    if(state==='sleep'){
      rect(7,19,16,9,accent);rect(9,22,3,1,ink);rect(17,22,3,1,ink);rect(12,25,4,1,ink);
      ctx.fillStyle=secondary;ctx.font='3px monospace';ctx.fillText('z Z',28,12+Math.round(Math.sin(t)));
    }else{
      const tilt=state==='thinking'?Math.round(Math.sin(t*3)):0;
      ctx.save();ctx.translate(tilt,0);
      if(state==='error'){rect(5,9,7,4,accent);rect(23,9,7,4,accent)}
      else{rect(7,3,4,10,accent);rect(10,6,3,8,accent);rect(23,3,4,10,accent);rect(21,6,3,8,accent);rect(8,6,2,5,pale);rect(24,6,2,5,pale)}
      rect(7,11,21,10,accent);rect(5,14,25,5,accent);rect(8,18,19,4,pale);
      const blink=state==='done'||(t%4.6>4.35);
      rect(11,14,3,blink?1:3,ink);rect(22,14,3,blink?1:3,ink);rect(17,18,2,1,ink);
      ctx.restore();
      const tap=state==='streaming'?Math.floor(t*6)%2:0;
      rect(12,27-tap,4,3,accent);rect(23,27+tap,4,3,accent);
      if(state==='waiting'){rect(5,20,4,5,accent);rect(3,18,4,3,accent)}
      if(state==='thinking')for(let i=0;i<3;i++)rect(14+i*4,0,2,1,Math.floor(t*3)%3===i?ink:secondary);
      if(state==='error'){rect(34,8,1,4,ink);rect(34,14,1,1,ink)}
      if(state==='done'&&t<1.2){rect(5,6,1,5,accent);rect(3,8,5,1,accent);rect(33,4,1,5,accent);rect(31,6,5,1,accent)}
    }
    ctx.restore();
    if(state==='done'&&t>1.8&&!cycling)change('idle');
  }
  change(state);requestAnimationFrame(render);
})();
</script>
